<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="description" content="React Dice Complete — a flexible, animated dice rolling library for React. Try the interactive demo."/><meta name="theme-color" content="#6366f1"/><title>React Dice Complete — Animated Dice for React</title><link rel="icon" href="./die-icon.png"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/><script>;(function () {

        --muted: #98a1b3;

      .theme-toggle {

      .total {

      .btn-roll:active {
        transform: translateY(0);
      }
      .btn-roll:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }

      /* Dice stage */
      .stage {
        display: flex;
        justify-content: center;
        padding: clamp(24px, 6vw, 48px) 16px;
        background: radial-gradient(120% 120% at 50% 0%, var(--surface-2) 0%, var(--surface) 70%);
      }

      /* Spinner */
      .sk-cube-grid {
        width: 22px;
        height: 22px;
        position: relative;
      }
      .sk-cube-grid .sk-cube {
        width: 33%;

        float: left;

      .sk-cube-grid .sk-cube2 {
        animation-delay: 0.3s;
      }
      .sk-cube-grid .sk-cube3 {
        animation-delay: 0.4s;
      }
      .sk-cube-grid .sk-cube4 {
        animation-delay: 0.1s;
      }
      .sk-cube-grid .sk-cube5 {
        animation-delay: 0.2s;
      }
      .sk-cube-grid .sk-cube6 {
        animation-delay: 0.3s;
      }
      .sk-cube-grid .sk-cube7 {
        animation-delay: 0s;
      }
      .sk-cube-grid .sk-cube8 {
        animation-delay: 0.1s;
      }
      .sk-cube-grid .sk-cube9 {

      }
      @keyframes sk-cubeGridScaleDelay {

        100% {

        }
        35% {

        }
      }

      @media (prefers-reduced-motion: reduce) {

      }

      /* ---------- Mobile: collapse the config panel ---------- */
      @media (max-width: 640px) {
        .config-toggle {

        }

          display: block;
        }

          gap: 14px;
          padding: 18px;
        }
        .action {
          justify-content: center;
          text-align: center;
        }
        .btn-roll {
          width: 100%;
        }
        .action__left {
          width: 100%;
          justify-content: center;
        }
      }</style><script defer="defer" src="./bundle.js"></script></head><body><header class="site-header"><div class="container"><h1>React Dice Complete <span class="die-emoji">🎲</span></h1><p class="lead">The flexible and amazing dice rolling library built with <a href="https://react.dev" target="_blank" rel="noopener">React</a></p></div></header><div class="subbar"><div class="container"><div class="subbar__left"><a href="https://github.com/AdamTyler/react-dice-complete" target="_blank" rel="noopener">Code &amp; Docs on GitHub</a></div><div class="subbar__right"><span class="github-star"><a class="github-button" href="https://github.com/AdamTyler/react-dice-complete" data-show-count="true" data-size="large" aria-label="Star AdamTyler/react-dice-complete on GitHub">Star</a> </span><button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><span class="icon-moon" aria-hidden="true">🌙</span> <span class="icon-sun" aria-hidden="true">☀️</span></button></div></div></div><main class="container"><div id="app"></div></main><footer class="site-footer"><div class="container">Copyright © <a href="http://adam-tyler.com" target="_blank" rel="noopener">Adam Tyler</a><script>document.write(new Date().getFullYear())</script>. ISC Licensed.</div></footer><script>;(function () {
        var btn = document.getElementById('themeToggle')
        if (!btn) return
        btn.addEventListener('click', function () {
